<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 문서 챗봇</title>
<link rel="stylesheet" href="/static/style.css">
<!-- 화면을 그리기 전에 로그인 확인 → 안 돼 있으면 바로 로그인 화면으로 -->
<script src="/static/common.js"></script>
<script>Auth.require();</script>
</head>
<body>
<div class="chat-page">
  <header>
    <h1>사내 문서 챗봇</h1>
    <span class="who" id="who"></span>
    <nav>
      <a class="btn" id="adminLink" href="/static/admin.html" hidden>관리자</a>
      <button class="btn" id="logout">로그아웃</button>
    </nav>
  </header>
  <div id="log">
    <div class="msg bot">문서 모드: 등록된 문서 내용만 근거로 답해요. 문서에 없으면 답하지 않고 기록해 둬요.
SQL 모드: 상품 DB 조회 SQL을 만들어 드려요. 예를 들면
· 목록: "라이더 목록 보여줘"
· 하위 구조: "CRD001 카드에 연결된 하위 오브젝트"
· 상위 구조: "FEE01 수수료가 붙은 상위 상품"
· 속성: "INS001 보험상품의 보험기간이랑 납입기간 알려줘"</div>
  </div>
  <form class="chat-form" id="form">
    <div class="mode-toggle" role="group" aria-label="질문 모드">
      <button type="button" data-mode="doc" aria-pressed="true">문서</button>
      <button type="button" data-mode="sql" aria-pressed="false">SQL</button>
    </div>
    <input id="q" autocomplete="off" placeholder="질문을 입력하세요" autofocus>
    <button class="btn primary" id="send">보내기</button>
  </form>
</div>
<script>
  if (Auth.require()) {
    document.getElementById("who").textContent = Auth.username + (Auth.role === "admin" ? " (관리자)" : "");
    document.getElementById("adminLink").hidden = Auth.role !== "admin";
  }
  document.getElementById("logout").addEventListener("click", Auth.logout);

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function add(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addMeta(bubble, text) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = text;
    bubble.appendChild(meta);
  }

  // ── 질문 모드: 문서(RAG) / SQL(Text-to-SQL). 마지막 선택은 이 브라우저에 기억 ──
  const PLACEHOLDER = {
    doc: "질문을 입력하세요",
    sql: "예: CRD001 카드에 연결된 하위 오브젝트",
  };
  let mode = "doc";
  try { if (localStorage.getItem("chatMode") === "sql") mode = "sql"; } catch {}

  function setMode(next) {
    mode = next;
    for (const b of document.querySelectorAll(".mode-toggle button")) {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", String(on));
    }
    input.placeholder = PLACEHOLDER[mode];
    try { localStorage.setItem("chatMode", mode); } catch {}
  }
  for (const b of document.querySelectorAll(".mode-toggle button")) {
    b.addEventListener("click", () => { setMode(b.dataset.mode); input.focus(); });
  }
  setMode(mode);

  // 화면 표시용 줄바꿈 (FROM·JOIN·WHERE·AND·ORDER BY 앞에서). 복사해도 그대로 실행되는 SQL이다
  function prettySql(sql) {
    return sql.trim().replace(/\s+(FROM|JOIN|WHERE|AND|ORDER BY)\s+/g, "\n$1 ");
  }

  function copyButton(getText) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.textContent = "복사";
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(getText());
        btn.textContent = "복사됨";
      } catch {
        btn.textContent = "복사 실패";
      }
      setTimeout(() => { btn.textContent = "복사"; }, 1500);
    });
    return btn;
  }

  function showDocAnswer(bubble, r) {
    bubble.textContent = r.answer;
    if (r.unanswerable) bubble.classList.add("none");
    addMeta(bubble, r.unanswerable
      ? `미답변으로 기록됨 · 최고 점수 ${r.top_score.toFixed(3)}`
      : `출처: ${r.sources.join(", ")} · 최고 점수 ${r.top_score.toFixed(3)}`);
  }

  function showSqlAnswer(bubble, r) {
    if (r.status !== "ok") {
      bubble.textContent = "지원하지 않는 질문이에요: " + (r.message || "");
      bubble.classList.add("none");
      return;
    }
    bubble.textContent = "SQL을 만들었어요. 값이 채워져 있어서 DB 도구에 바로 붙여 넣어 실행할 수 있어요.";
    const block = document.createElement("div");
    block.className = "sql-block";

    const pre = document.createElement("pre");
    pre.textContent = prettySql(r.rendered_sql);
    const row = document.createElement("div");
    row.className = "row";
    row.appendChild(copyButton(() => pre.textContent));
    block.append(pre, row);
    bubble.appendChild(block);
  }

  // ── 새로고침해도 대화가 이어지도록 최근 2주 대화를 서버 이력에서 불러와 다시 그린다 ──
  async function loadHistory() {
    try {
      const items = await api("/api/history/me");
      for (const h of items) {
        add(h.question, "me");
        const bubble = add("", "bot");
        if (h.mode === "sql") {
          // 이력에는 복사용 SQL(정상) 또는 거절 사유(미답변)가 answer에 저장되어 있다
          showSqlAnswer(bubble, {
            status: h.unanswerable ? "unsupported" : "ok",
            rendered_sql: h.answer,
            message: h.answer,
          });
        } else {
          showDocAnswer(bubble, {
            answer: h.answer,
            unanswerable: h.unanswerable,
            sources: h.sources,
            top_score: h.top_score ?? 0,
          });
        }
      }
    } catch (err) {
      const bubble = add("이전 대화를 불러오지 못했어요: " + err.message, "bot");
      bubble.classList.add("none");
    }
    log.scrollTop = log.scrollHeight;
  }
  if (Auth.token) loadHistory();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    add(query, "me");
    input.value = "";
    send.disabled = true;
    const askMode = mode;  // 응답을 기다리는 동안 토글을 바꿔도 보낸 모드로 표시
    const bubble = add(askMode === "sql" ? "SQL을 만드는 중..." : "답변을 찾는 중...", "bot");
    try {
      if (askMode === "sql") {
        showSqlAnswer(bubble, await api("/api/sql", { method: "POST", body: { query } }));
      } else {
        showDocAnswer(bubble, await api("/api/ask", { method: "POST", body: { query } }));
      }
    } catch (err) {
      bubble.textContent = "오류가 발생했어요: " + err.message;
      bubble.classList.add("none");
    } finally {
      send.disabled = false;
      log.scrollTop = log.scrollHeight;
      input.focus();
    }
  });
</script>
</body>
</html>
