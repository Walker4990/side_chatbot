<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 문서 챗봇</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --me: #2563eb; --me-text: #fff;
    --warn-bg: #fff7ed; --warn-text: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b21; --text: #e6e8eb; --muted: #9aa1ab;
      --line: #2a2f37; --accent: #60a5fa; --me: #2563eb; --me-text: #fff;
      --warn-bg: #2a1d12; --warn-text: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; width: fit-content; padding: 10px 14px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .bot.none { background: var(--warn-bg); color: var(--warn-text); }
  .meta { margin-top: 6px; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  button { padding: 10px 16px; font-size: 15px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>사내 문서 챗봇</h1>
  <p>등록된 문서 내용만 근거로 답해요. 문서에 없으면 답하지 않아요.</p>
</header>
<div id="log"></div>
<form id="form">
  <input id="q" autocomplete="off" placeholder="질문을 입력하세요" autofocus>
  <button id="send">보내기</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function add(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    add(query, "me");
    input.value = "";
    send.disabled = true;
    const bubble = add("답변을 찾는 중...", "bot");
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const r = await res.json();
      bubble.textContent = r.answer;
      if (r.unanswerable) bubble.classList.add("none");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = r.unanswerable
        ? `미답변 (사유: ${r.reason}) · 최고 점수 ${r.top_score.toFixed(3)}`
        : `출처: ${r.sources.join(", ")} · 최고 점수 ${r.top_score.toFixed(3)}`;
      bubble.appendChild(meta);
    } catch (err) {
      bubble.textContent = "오류가 발생했어요: " + err.message;
      bubble.classList.add("none");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
