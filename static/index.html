<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사내 문서 챗봇</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="chat-page">
  <header>
    <h1>사내 문서 챗봇</h1>
    <span class="who" id="who"></span>
    <nav>
      <a class="btn" id="adminLink" href="/static/admin.html" hidden>관리자</a>
      <button class="btn" id="logout">로그아웃</button>
    </nav>
  </header>
  <div id="log">
    <div class="msg bot">등록된 문서 내용만 근거로 답해요. 문서에 없으면 답하지 않고 기록해 둬요.</div>
  </div>
  <form class="chat-form" id="form">
    <input id="q" autocomplete="off" placeholder="질문을 입력하세요" autofocus>
    <button class="btn primary" id="send">보내기</button>
  </form>
</div>
<script src="/static/common.js"></script>
<script>
  if (Auth.require()) {
    document.getElementById("who").textContent = Auth.username + (Auth.role === "admin" ? " (관리자)" : "");
    document.getElementById("adminLink").hidden = Auth.role !== "admin";
  }
  document.getElementById("logout").addEventListener("click", Auth.logout);

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("q");
  const send = document.getElementById("send");

  function add(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const query = input.value.trim();
    if (!query) return;
    add(query, "me");
    input.value = "";
    send.disabled = true;
    const bubble = add("답변을 찾는 중...", "bot");
    try {
      const r = await api("/api/ask", { method: "POST", body: { query } });
      bubble.textContent = r.answer;
      if (r.unanswerable) bubble.classList.add("none");
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = r.unanswerable
        ? `미답변으로 기록됨 · 최고 점수 ${r.top_score.toFixed(3)}`
        : `출처: ${r.sources.join(", ")} · 최고 점수 ${r.top_score.toFixed(3)}`;
      bubble.appendChild(meta);
    } catch (err) {
      bubble.textContent = "오류가 발생했어요: " + err.message;
      bubble.classList.add("none");
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
